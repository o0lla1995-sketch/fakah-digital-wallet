plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fakah.wallet'
    compileSdk 34

    defaultConfig {
        applicationId "com.fakah.wallet"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // API endpoint — overridden at final release build with the deployed URL
        buildConfigField "String", "API_BASE_URL", "\"${findProperty('FAKAH_API_URL') ?: 'http://10.0.2.2:8080'}\""
        // SSL pins (sha256/...) comma separated; "NOPIN" disables pinning (dev only)
        buildConfigField "String", "SSL_PINS", "\"${findProperty('FAKAH_SSL_PINS') ?: 'NOPIN'}\""
        buildConfigField "boolean", "PINNING_ENABLED", "true"
    }

    signingConfigs {
        release {
            // keystore.properties generated locally; NEVER committed
            def ks = file("../keystore.properties")
            if (ks.exists()) {
                def p = new Properties()
                ks.withInputStream { p.load(it) }
                storeFile file(p["storeFile"])
                storePassword p["storePassword"]
                keyAlias p["keyAlias"]
                keyPassword p["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (file("../keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField "boolean", "PINNING_ENABLED", "false"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    def lifecycle = '2.8.4'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle"

    implementation 'androidx.biometric:biometric:1.1.0'

    def coroutines = '1.8.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines"

    def retrofit = '2.11.0'
    implementation "com.squareup.retrofit2:retrofit:$retrofit"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // QR: generation (zxing core) + scanning (embedded, handles camera + permissions)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // FCM client — activates fully once google-services.json is added
    implementation 'com.google.firebase:firebase-messaging:24.0.1'
}
